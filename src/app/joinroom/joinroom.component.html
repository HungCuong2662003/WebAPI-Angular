<div class="container mt-4">
  <h3>Tham gia phòng có mật khẩu</h3>

  <div class="form-group">
    <label for="roomId">Room ID</label>
    <input
      type="text"
      id="roomId"
      [(ngModel)]="roomId"
      name="roomId"
      class="form-control"
      placeholder="Nhập Room ID"
    />
  </div>

  <div class="form-group mt-2">
    <label for="password">Mật khẩu phòng</label>
    <input
      type="password"
      id="password"
      [(ngModel)]="password"
      name="password"
      class="form-control"
      placeholder="Nhập mật khẩu"
    />
  </div>

  <button class="btn btn-primary mt-3" (click)="joinRoom()">Tham gia phòng</button>

  <div *ngIf="message" class="alert alert-warning mt-3">
    {{ message }}
  </div>
</div>
